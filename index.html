<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6b3a">
<title>Menedżer Piłkarski</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#eef1e6;--card:#fff;--tx:#16241b;--mu:#5f6d62;--ac:#1d6b3a;--hi:#c9a400;--bd:#d5dccb;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1f15;--card:#143023;--tx:#eef2e4;--mu:#9bb0a0;--ac:#2f8f55;--hi:#f2cf3a;--bd:#25432f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1f15;--card:#143023;--tx:#eef2e4;--mu:#9bb0a0;--ac:#2f8f55;--hi:#f2cf3a;--bd:#25432f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Georgia,"Times New Roman",serif}
#app{max-width:600px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:28px;margin:6px 0 4px;letter-spacing:-.5px}
h2{font-size:18px;margin:22px 0 8px;border-bottom:2px solid var(--hi);padding-bottom:4px}
summary{cursor:pointer}
small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.mu{color:var(--mu);font-size:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
button,select,input{font:inherit;color:var(--tx)}
button{cursor:pointer}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:9px;width:100%;min-width:0}
.cl{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:10px;text-align:left}
.hd{background:var(--ac);color:#fff;padding:12px 14px;border-radius:6px}
.hd b{font-size:20px}.hd div{font-size:13px;opacity:.92}
.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:auto}
.tabs button{flex:1 0 auto;padding:14px 12px;background:none;border:0;font-size:15px;white-space:nowrap}
.tabs .on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--hi)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-top:10px}
.fl{border-color:var(--hi)}
.vs{display:flex;justify-content:space-between;gap:8px;font-size:19px;font-weight:700}
.vs span:last-child{text-align:right}
.sc{font-size:34px;text-align:center;margin:4px 0}
.btn{display:block;background:var(--ac);color:#fff;border:0;border-radius:6px;padding:13px;width:100%;font-weight:700;margin-top:10px}
.btn:disabled{opacity:.5}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg button,.fb{flex:1 1 auto;padding:9px 4px;border:1px solid var(--bd);background:var(--bg);border-radius:6px;font-size:14px;text-align:center}
.seg .on{background:var(--hi);color:#1a1a00;border-color:var(--hi);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 3px;text-align:center;border-bottom:1px solid var(--bd)}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.me{background:color-mix(in srgb,var(--hi) 25%,transparent);font-weight:700}
.pl{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--bd)}
.pl.xi{background:color-mix(in srgb,var(--hi) 38%,transparent);border-left:4px solid var(--hi)}
.pl.on{outline:2px solid var(--ac);outline-offset:-2px}
.bd{display:inline-block;font-size:12px;font-weight:700;border-radius:10px;padding:1px 7px;margin-left:5px;border:1px solid var(--bd);background:var(--bg);vertical-align:middle}
.bd.g{border-color:#1a9d4a;color:#1a9d4a}
.bd.a{border-color:#2f7fd0;color:#2f7fd0}
.bd.c{border-color:var(--hi);color:var(--tx)}
.bd.z{opacity:.4}
.bd.big{font-size:15px;background:var(--hi);color:#1a1a00;border-color:var(--hi);opacity:1}
.up{color:#1a9d4a;font-weight:700;font-size:13px}
.dn{color:#d33;font-weight:700;font-size:13px}
.hl{font-weight:800;color:var(--tx);font-size:15px;text-decoration:underline}
.pl i{font-style:normal;width:22px;color:var(--mu);font-size:13px}
.pl b{flex:1;font-weight:400}
.pl em{font-style:normal;font-weight:700;min-width:44px;text-align:right}
.pl em small{display:inline}
.pl span{display:flex;gap:4px}
.pl button{border:1px solid var(--bd);background:var(--bg);border-radius:6px;padding:5px 8px;font-size:13px}
textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:9px;font:13px monospace}
.ev div{padding:2px 0;font-size:14px}
.pitch{position:relative;aspect-ratio:3/4;border:2px solid #e8efe0;border-radius:6px;background:repeating-linear-gradient(#2e7d46 0 12.5%,#2a7342 12.5% 25%);margin-top:8px}
.pitch::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #e8efe066}
.dot{position:absolute;transform:translate(-50%,-50%);width:62px;background:#0d1f15cc;color:#fff;border:2px solid #e8efe0;border-radius:8px;padding:3px 2px;font-size:11px;line-height:1.15;text-align:center}
.dot b{display:block;font-size:15px}
.dot span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot.on{border-color:var(--hi);background:#7a6500}
</style></head><body><div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body></html>
